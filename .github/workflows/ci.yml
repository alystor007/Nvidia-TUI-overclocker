name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint deps
        run: pip install ruff

      - name: Byte-compile all scripts
        run: python -m py_compile gpu_tui.py apply_overclock.py reset_overclock.py

      - name: Lint
        run: ruff check --select F,E gpu_tui.py apply_overclock.py reset_overclock.py
